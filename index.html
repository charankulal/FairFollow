<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FollowFair</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">FollowFair Results for <span id="username"></span></h2>
        <div class="mt-4">
            <h4>Users followed by <span id="username-following"></span> but not following back:</h4>
            <ul id="notFollowingBackList" class="list-group"></ul>
        </div>
        <div class="mt-4">
            <h4>Users following <span id="username-followers"></span> but not followed back:</h4>
            <ul id="notFollowedBackList" class="list-group"></ul>
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="github_followers.js"></script>
</body>
</html>
